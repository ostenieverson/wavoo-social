name: Gerar imagens IA

on:
  push:
    paths:
      - "media/**/imagens.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-imagens
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gerar imagens pendentes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python3 scripts/gerar_imagens.py
      - name: Commit das imagens
        run: |
          git config user.name "wavoo-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media
          git diff --cached --quiet && exit 0
          git commit -m "ia: imagens geradas"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
