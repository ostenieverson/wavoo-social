name: Gerar narração IA

on:
  push:
    paths:
      - "media/**/narracao.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-voz
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependências (Kokoro, código aberto)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y espeak-ng ffmpeg >/dev/null
          pip install -q "kokoro>=0.9.4" soundfile numpy
      - name: Gerar falas pendentes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
        run: python3 scripts/gerar_voz.py
      - name: Commit das falas
        run: |
          git config user.name "wavoo-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media
          git diff --cached --quiet && exit 0
          git commit -m "ia: narração gerada"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
